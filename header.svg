<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900">
  <title>Alex Zaurov — Prod Support by Day · AI Builder by Night</title>
  <defs>
    <style>
      @keyframes wave-left  { from { transform: translateX(0);      } to { transform: translateX(-900px); } }
      @keyframes wave-right { from { transform: translateX(-900px); } to { transform: translateX(0);      } }
      @keyframes glow-pulse { 0%,100% { opacity:.52; } 50% { opacity:.88; } }
      .wl1 { animation: wave-left   9s linear      infinite; }
      .wr1 { animation: wave-right 13s linear      infinite; }
      .wl2 { animation: wave-left   7s linear      infinite; }
      .wr2 { animation: wave-right 17s linear      infinite; }
      .gp  { animation: glow-pulse  5s ease-in-out infinite; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07051a"/>
      <stop offset="100%" stop-color="#0d0a22"/>
    </linearGradient>
    <radialGradient id="cglow" cx="50%" cy="68%" r="44%">
      <stop offset="0%" stop-color="#c89120" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="bw" x="-5%" y="-60%" width="110%" height="220%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="tg" x="-15%" y="-50%" width="130%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#c89120" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="900" height="200" fill="url(#bg)"/>

  <!-- pulsing warm glow behind text -->
  <ellipse class="gp" cx="450" cy="115" rx="310" ry="82" fill="url(#cglow)"/>

  <!-- wave 1 — deep violet, slowest, rightward -->
  <g class="wr2">
    <path d="M0,152 C150,122 300,122 450,152 S750,182 900,152 S1200,122 1350,152 S1650,182 1800,152 L1800,200 L0,200 Z"
          fill="rgba(88,28,198,0.22)" filter="url(#bw)"/>
  </g>

  <!-- wave 2 — teal, medium-slow, leftward -->
  <g class="wl1">
    <path d="M0,159 C150,136 300,136 450,159 S750,182 900,159 S1200,136 1350,159 S1650,182 1800,159 L1800,200 L0,200 Z"
          fill="rgba(20,108,205,0.18)" filter="url(#bw)"/>
  </g>

  <!-- wave 3 — violet-rose, medium-fast, rightward -->
  <g class="wr1">
    <path d="M0,164 C150,149 300,149 450,164 S750,179 900,164 S1200,149 1350,164 S1650,179 1800,164 L1800,200 L0,200 Z"
          fill="rgba(160,42,220,0.16)"/>
  </g>

  <!-- wave 4 — gold accent, fastest, leftward -->
  <g class="wl2">
    <path d="M0,170 C150,158 300,158 450,170 S750,182 900,170 S1200,158 1350,170 S1650,182 1800,170 L1800,200 L0,200 Z"
          fill="rgba(200,148,28,0.12)"/>
  </g>

  <!-- name -->
  <text x="450" y="85"
        text-anchor="middle"
        font-family="Georgia,'Times New Roman',serif"
        font-size="50" font-weight="bold" letter-spacing="4"
        fill="rgba(255,255,255,0.96)"
        filter="url(#tg)">ALEX ZAUROV</text>

  <!-- gold rule -->
  <line x1="212" y1="104" x2="688" y2="104"
        stroke="rgba(200,148,28,0.50)" stroke-width="1"/>

  <!-- tagline -->
  <text x="450" y="128"
        text-anchor="middle"
        font-family="Georgia,'Times New Roman',serif"
        font-size="13" letter-spacing="3"
        fill="rgba(210,185,130,0.82)">PROD SUPPORT BY DAY · AI BUILDER BY NIGHT</text>
</svg>
